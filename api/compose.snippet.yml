# Add this service to the MoonTV stack (Portainer stack "moontv", docker-compose.yml)
  moontv-api:
    build: ./moontv-api          # directory containing api/moontv-api.py + Dockerfile
    image: moontv-api:local
    container_name: moontv-api
    restart: unless-stopped
    ports:
      - '8788:8788'
    environment:
      - MOONTV_UPSTREAM=http://moontv-core:3000
      - MOONTV_USER=${MOONTV_USER}      # MoonTV login used by the bridge
      - MOONTV_PASS=${MOONTV_PASS}
    volumes:
      - moontv-api-cache:/cache
    networks:
      - moontv-network
    depends_on:
      - moontv-core
