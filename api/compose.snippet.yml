# Add this service to the MoonTV stack (Portainer stack "moontv", docker-compose.yml)
  moontv-api:
    # Build straight from GitHub (no local checkout needed). To pin a release use
    # ...moontv-webos.git#v2.5.0 ; for a local checkout use context: ./moontv-webos
    build:
      context: https://github.com/coomteng/moontv-webos.git#main
      dockerfile: api/Dockerfile
    pull_policy: build           # image exists only locally; never try to pull it from a registry
    image: moontv-api:local
    container_name: moontv-api
    restart: unless-stopped
    ports:
      - '8788:8788'
    environment:
      - MOONTV_UPSTREAM=http://moontv-core:3000
      - MOONTV_USER=${MOONTV_USER}      # MoonTV login used by the bridge
      - MOONTV_PASS=${MOONTV_PASS}
      # optional: accounts pre-loaded onto every TV on its first start ("user:pass,user2:pass2")
      # - MOONTV_SEED_ACCOUNTS=${MOONTV_SEED_ACCOUNTS}
    volumes:
      - moontv-api-cache:/cache
    networks:
      - moontv-network
    depends_on:
      - moontv-core
